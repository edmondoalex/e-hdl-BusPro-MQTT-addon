<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ksenia Smart Home · e-Control Hub</title>
  <link rel="stylesheet" href="static/hub/hub.css?v=0.1.466">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#4a5358;color:#f4f7f8;font:14px/1.45 system-ui,Segoe UI,sans-serif}
    main{max-width:1180px;margin:auto;padding:30px 22px 80px}.hero,.panel{background:#202426;border:1px solid rgba(255,255,255,.13);border-radius:18px;padding:22px;margin-bottom:18px}.hero h1{margin:0 0 5px;font-size:30px}.muted{color:#aeb9bd}.status{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.chip{padding:7px 11px;border-radius:999px;background:#151a1c;border:1px solid rgba(255,255,255,.13)}.ok{color:#4ee0a4}.warn{color:#ffd166}.bad{color:#ff758f}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}.tabs button,.cmd{border:1px solid rgba(255,255,255,.15);background:#171c1e;color:#f4f7f8;border-radius:10px;padding:9px 12px;font-weight:650;cursor:pointer}.tabs button.active{border-color:#55d6e8;color:#55d6e8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.card{background:#171c1e;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:16px}.card h3{margin:0 0 4px}.meta{font-size:12px;color:#aeb9bd}.state{margin:13px 0;padding:9px;background:#101416;border-radius:9px;white-space:pre-wrap;word-break:break-word}.actions{display:flex;gap:7px;flex-wrap:wrap}.empty{padding:28px;text-align:center;color:#aeb9bd}.error{margin-top:10px;color:#ff9bae}
  </style>
</head>
<body><main>
  <section class="hero"><div class="muted">INTEGRAZIONE SMART HOME</div><h1>Ksenia</h1><div class="muted">Uscite, cover, sensori ambientali, termostati e scenari autorizzati dal catalogo Ksenia. Sicurezza esclusa.</div><div class="status" id="status"></div><div class="error" id="error"></div></section>
  <section class="panel"><div class="tabs" id="tabs"></div><div class="grid" id="grid"></div></section>
</main><script src="static/hub/hub-nav.js?v=0.1.466"></script><script>
const labels={all:'Panoramica',light:'Uscite e luci',switch:'Uscite e luci',cover:'Cover e varchi',sensor:'Sensori ambientali',binary_sensor:'Sensori ambientali',climate:'Termostati',scene:'Scenari Smart Home'};
let snap=null,filter=(location.hash||'#all').slice(1);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function groupKey(c){if(['light','switch','dimmer'].includes(c))return'light';if(['cover','gate','garage_door','awning','shutter'].includes(c))return'cover';if(['environment_sensor','temperature_sensor','humidity_sensor','illuminance_sensor'].includes(c))return'sensor';if(c==='thermostat')return'climate';if(c==='scenario')return'scene';return c}
function stateText(d){const v=d.state&&d.state.value;return v==null?'Stato non ricevuto':typeof v==='object'?JSON.stringify(v,null,2):String(v)}
async function readJson(r){const text=await r.text();let data;try{data=JSON.parse(text)}catch(_){throw new Error(`Risposta non valida dal server (${r.status})`)}if(!r.ok)throw new Error(data.detail||data.error||`Errore server ${r.status}`);return data}
async function command(id,action,value=null){const b=document.querySelector(`[data-id="${CSS.escape(id)}"][data-action="${CSS.escape(action)}"]`);if(b)b.disabled=true;try{const r=await fetch(`api/integrations/ksenia/command/${encodeURIComponent(id)}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,value})});const j=await readJson(r);if(!j.ok)throw new Error(j.detail||j.error||j.status||'Comando non confermato');await load()}catch(e){alert(e.message)}finally{if(b)b.disabled=false}}
function runAction(id,action){const d=(snap?.devices||[]).find(x=>x.device_id===id),spec=d?.commands?.[action]||{},raw=JSON.stringify(spec.payload??'');let value=null;if(raw.includes('{value}')||spec.requires_value){const entered=prompt(spec.value_label||`Valore per ${action}`);if(entered===null)return;value=entered;const n=Number(entered);if(entered.trim()!==''&&Number.isFinite(n))value=n}command(id,action,value)}
function render(){const s=snap||{},ds=s.devices||[];document.getElementById('status').innerHTML=`<span class="chip ${s.availability==='online'?'ok':'warn'}">${esc(s.availability||'non rilevata')}</span><span class="chip">${ds.length} risorse autorizzate</span><span class="chip">MQTT ${s.mqtt_connected?'online':'offline'}</span>`;document.getElementById('error').textContent=s.last_error||'';
 const groups=['all','light','cover','sensor','climate','scene','diagnostics'];if(!groups.includes(filter))filter='all';document.getElementById('tabs').innerHTML=groups.map(k=>`<button class="${filter===k?'active':''}" onclick="location.hash='${k}'">${k==='diagnostics'?'Diagnostica':labels[k]}</button>`).join('');if(filter==='diagnostics'){document.getElementById('grid').innerHTML=`<article class="card"><h3>Contratto</h3><div class="state">Rilevato: ${s.detected?'sì':'no'}\nCompatibile: ${s.compatible?'sì':'no'}\nSchema catalogo: ${esc(s.catalog_schema_version||'—')}\nMQTT: ${s.mqtt_connected?'online':'offline'}\nErrore: ${esc(s.last_error||'—')}</div></article>`;return}const shown=ds.filter(d=>filter==='all'||groupKey(d.device_class)===filter);
 document.getElementById('grid').innerHTML=shown.length?shown.map(d=>{const cmds=Object.keys(d.commands||{});return `<article class="card"><h3>${esc(d.name||d.device_id)}</h3><div class="meta">${esc(d.device_class)} · Ksenia · ${d.stale?'STALE':'aggiornato'}${d.read_only?' · sola lettura':''}</div><div class="state">${esc(stateText(d))}</div><div class="actions">${cmds.map(a=>`<button class="cmd" data-id="${esc(d.device_id)}" data-action="${esc(a)}" onclick="runAction('${esc(d.device_id)}','${esc(a)}')">${esc(a)}</button>`).join('')}</div></article>`}).join(''):`<div class="empty">${s.detected?'Nessuna risorsa autorizzata in questa sezione.':'Manifest Ksenia non ancora rilevato.'}</div>`}
async function load(){try{const r=await fetch('api/integrations/ksenia',{cache:'no-store'});snap=await readJson(r);document.getElementById('error').textContent='';render()}catch(e){document.getElementById('error').textContent=e.message||String(e)}}window.addEventListener('hashchange',()=>{filter=(location.hash||'#all').slice(1);render()});load();setInterval(load,3000);
</script></body></html>
